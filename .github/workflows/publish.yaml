name: Build and Publish HA Add-on

on:
  push:
    branches: [ "main" ]
    paths:
      - 'carddav-ldap/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Add-on using Home Assistant Builder
        uses: home-assistant/builder@master
        with:
          args: |
            --amd64 \
            --aarch64 \
            --target carddav-ldap \
            --image "ghcr.io/${{ github.repository_owner }}/carddav-ldap-homeassistant-{arch}" \
            --docker-hub ghcr.io
