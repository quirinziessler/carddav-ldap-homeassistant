configuration:
  accounts:
    name: "Apple iCloud Accounts"
    description: "Add as many Apple IDs from your family as you want."
  default_country:
    name: "Default Country Code"
    description: "Country code (e.g. 'DE', 'AT', 'CH') for parsing and intelligent deduplication of local phone numbers."
  sync_interval_cron:
    name: "Sync Interval (Cron)"
    description: "Cron expression for the sync interval (e.g. '0 * * * *' for hourly or '*/15 * * * *' for every 15 min)."
  ldap_user:
    name: "LDAP Username (Optional)"
    description: "Username for your phone (e.g. 'phone'). Leave empty for anonymous access (no password)."
  ldap_pass:
    name: "LDAP Password (Optional)"
    description: "Password for your phone. Leave empty if no password is required."
