configuration:
  accounts:
    name: "Apple iCloud Accounts"
    description: "Füge hier beliebig viele Apple-IDs deiner Familienmitglieder hinzu."
  default_country:
    name: "Standard-Ländercode"
    description: "Ländercode (z. B. 'DE', 'AT', 'CH') zur Erkennung und intelligenten Deduplizierung von Nummern ohne Vorwahl."
  sync_interval_cron:
    name: "Sync-Intervall (Cron)"
    description: "Cron-Ausdruck für das Synchronisationsintervall (z. B. '0 * * * *' für stündlich oder '*/15 * * * *' für alle 15 Min)."
  ldap_user:
    name: "LDAP-Benutzername (Optional)"
    description: "Benutzername für dein Telefon (z. B. 'telefon'). Leer lassen für passwortfreien Zugriff (Anonymous Bind)."
  ldap_pass:
    name: "LDAP-Passwort (Optional)"
    description: "Passwort für dein Telefon. Leer lassen, wenn kein Passwort gewünscht ist."
  unifi_talk_enabled:
    name: "UniFi Talk Synchronisation aktivieren"
    description: "Schaltet den automatischen Sync der Kontakte direkt in deine UniFi Console (Talk) ein."
  unifi_talk_host:
    name: "UniFi Console IP / Hostname"
    description: "IP-Adresse oder Hostname deiner UniFi Console (z. B. 192.168.1.1 oder udm.local)."
  unifi_talk_user:
    name: "UniFi OS Benutzername"
    description: "Lokaler Benutzername auf deiner UniFi Console mit Rechten für UniFi Talk."
  unifi_talk_pass:
    name: "UniFi OS Passwort"
    description: "Passwort des UniFi OS Benutzers."
  unifi_talk_contact_list:
    name: "UniFi Talk Kontaktliste"
    description: "Name der Kontaktliste in UniFi Talk, in die Kontakte abgelegt werden sollen (z. B. 'iCloud' oder 'Familie')."
  unifi_talk_verify_ssl:
    name: "UniFi SSL-Zertifikat prüfen"
    description: "Bei selbstsignierten Zertifikaten im lokalen Netzwerk deaktiviert lassen (false)."
