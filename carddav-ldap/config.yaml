name: "CardDAV to OpenLDAP Bridge"
version: "1.2.3"
slug: "carddav_openldap"
description: "Robuster OpenLDAP-Server, der via Cron aus Apple iCloud synchronisiert wird."
arch: ["aarch64", "amd64"]
init: false
image: "ghcr.io/quirinziessler/carddav-ldap-homeassistant-{arch}"
hassio_api: true
options:
  accounts:
    - user: "deine.apple.id@icloud.com"
      pass: "app-spezifisches-passwort"
  default_country: "DE"
  sync_interval_cron: "0 * * * *"
  ldap_user: ""
  ldap_pass: ""
schema:
  accounts:
    - user: str
      pass: password
  default_country: str
  sync_interval_cron: str
  ldap_user: str?
  ldap_pass: password?
ports:
  389/tcp: 389
map:
  - config:rw
